[workspace]
resolver = "2"
members = ["crates/nox-core", "crates/sync", "crates/gui"]

[workspace.package]
edition = "2024"
version = "0.1.2"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
# gpui-component declares the same bare Zed URL; Cargo.lock pins it to e0931d5a.
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui" }
gpui-platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git", rev = "5a5e2abc837b6d927e2b38e2097d2fbf39ebee77", package = "gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component.git", rev = "5a5e2abc837b6d927e2b38e2097d2fbf39ebee77", package = "gpui-component-assets" }
gpui-rsx = { git = "https://github.com/Dave136/gpui-rsx", rev = "9f4edadf21293776e17362878e1fc17e01309fc2" }

[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", package = "gpui", version = "=0.2.2" }
