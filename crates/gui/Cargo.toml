[package]
name = "gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "nox"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
futures = "0.3"
gpui.workspace = true
gpui-platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
gpui-rsx.workspace = true
nox-core = { path = "../nox-core" }
reqwest_client = { git = "https://github.com/zed-industries/zed", package = "reqwest_client" }
rust-embed = "8.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
http_client = { git = "https://github.com/zed-industries/zed", package = "http_client", features = ["test-support"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSNotification",
] }

[lints]
workspace = true
