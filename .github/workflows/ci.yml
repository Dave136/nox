name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.95.0"

jobs:
  app-ci:
    name: App CI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macOS
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        uses: ./.github/actions/setup-rust-app
        with:
          rust-version: ${{ env.RUST_VERSION }}
          linux-native-deps: "true"

      - name: Cache Cargo dependencies and build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: cargo-v1-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked

      - name: Formatting
        shell: bash
        run: cargo fmt --check

      - name: Clippy
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The `gui` crate's view tests cannot run on macOS with the pinned
      # gpui-component: `Root::new` guards its AppKit accessibility hook with
      # `cfg(all(target_os = "macos", not(test)))`, but `cfg(test)` only applies
      # to the crate under test, never to a dependency — so the hook is compiled
      # into every downstream test binary, and gpui's test window answers
      # `window_handle()` with `unimplemented!()`. That is a panic, so
      # gpui-component's own `.ok()?` cannot absorb it. 45 view tests die on the
      # first line; the other 51 gui tests are platform-independent logic that
      # the Linux job already covers. nox-core and sync — including the
      # file-permission tests, which are the platform-sensitive ones — still run
      # here. Drop the exclusion once gpui-component fixes that guard.
      - name: Test
        if: runner.os != 'macOS'
        shell: bash
        run: cargo test --workspace --all-features

      - name: Test (macOS — gui excluded, see note above)
        if: runner.os == 'macOS'
        shell: bash
        run: cargo test --workspace --all-features --exclude gui

  dependency-audit:
    uses: ./.github/workflows/dependency-audit.yml
