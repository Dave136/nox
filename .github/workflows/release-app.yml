name: Release App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_VERSION: "1.95.0"

jobs:
  validate-release:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify tag, Cargo.toml, and changelog agree
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"release tag must be vX.Y.Z, got {tag!r}")

          version = tag.removeprefix("v")
          cargo = tomllib.loads(Path("Cargo.toml").read_text(encoding="utf-8"))
          cargo_version = cargo["workspace"]["package"]["version"]
          if cargo_version != version:
              raise SystemExit(
                  f"Cargo.toml workspace.package.version {cargo_version!r} does not match tag {tag!r}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(rf"^## +{re.escape(tag)}(?:\s|$)", re.MULTILINE)
          if not heading.search(changelog):
              raise SystemExit(f"CHANGELOG.md must contain a '## {tag}' section")
          PY

  build:
    name: Build app (${{ matrix.platform }})
    needs: validate-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: nox-linux-x86_64
            binary_name: nox
            package_os: linux
            release_assets: nox-linux-x86_64.deb nox-linux-x86_64.rpm nox-linux-x86_64.AppImage
          - platform: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            artifact_name: nox-macos-aarch64
            binary_name: nox
            package_os: macos
            release_assets: nox-macos-aarch64.dmg nox-macos-aarch64.zip
          # - platform: macOS Intel
          #   runner: macos-13
          #   target: x86_64-apple-darwin
          #   artifact_name: nox-macos-x86_64
          #   binary_name: nox
          #   package_zip: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"
          rustup target add "${{ matrix.target }}"
          rustc --version --verbose
          cargo --version --verbose

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libfontconfig1-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            rpm

      - name: Cache Cargo dependencies and build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-app-v1-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Fetch locked dependencies
        shell: bash
        run: cargo fetch --locked

      - name: Formatting gate
        shell: bash
        run: cargo fmt --check

      - name: Clippy gate
        shell: bash
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test gate
        if: runner.os != 'macOS'
        shell: bash
        run: cargo test --workspace --all-features

      - name: Test gate (macOS — gui excluded, see CI note)
        if: runner.os == 'macOS'
        shell: bash
        run: cargo test --workspace --all-features --exclude gui

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --package gui --bin nox --target "${{ matrix.target }}"

      - name: Package installer assets
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          scripts/package-release-assets.sh \
            "${{ matrix.package_os }}" \
            "${{ matrix.target }}" \
            "${{ matrix.artifact_name }}" \
            "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" \
            "$version"
          for expected in ${{ matrix.release_assets }}; do
            test -f "dist/$expected"
          done
          for artifact in dist/*; do
            shasum -a 256 "$artifact" > "$artifact.sha256"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Extract changelog section
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["GITHUB_REF_NAME"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## +{re.escape(tag)}[^\n]*\n(?P<body>.*?)(?=^## +|\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG.md must contain a '## {tag}' section")
          body = match.group("body").strip()
          if not body:
              raise SystemExit(f"CHANGELOG.md section for {tag} must not be empty")
          Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY

      - name: Create release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          body_path: release-notes.md
          files: dist/*
